_BASE_: ../Base-bagtricks.yml

INPUT:
  SIZE_TRAIN: [256, 256]
  SIZE_TEST: [256, 256]

MODEL:
  BACKBONE:
    WITH_IBN: True
    PRETRAIN_PATH: pretrained/veriwild_bot_R50-ibn.pth
  # WEIGHTS: logs/jackson/bagtricks_R50-ibn/model_0009.pth

  HEADS:
    POOL_LAYER: GeneralizedMeanPooling
    # NUM_CLASSES: 11

  LOSSES:
    NAME: ("CrossEntropyLoss", "TripletLoss", "MatchLoss")

    TRI:
      HARD_MINING: False
      MARGIN: 0.0
      SCALE: 10.0

DATASETS:
  NAMES: ("Caldot2",)
  TESTS: ("Caldot2",)

DATALOADER:
  SAMPLER_TRAIN: TrainingSampler
#   NUM_INSTANCE: 8
  NUM_WORKERS: 0 #8

SOLVER:
  IMS_PER_BATCH: 8 #32 #128 # 512 For 4 GPUs
  MAX_EPOCH: 120
  STEPS: [30, 70, 90]
  WARMUP_ITERS: 5000

  CHECKPOINT_PERIOD: 10
  AMP:
    ENABLED:
      False

TEST:
  EVAL_PERIOD: 20
  IMS_PER_BATCH: 256
  AQE:
    ENABLED: False

  RERANK:
    ENABLED: False

  PRECISE_BN:
    ENABLED: False

  ROC:
    ENABLED: False
